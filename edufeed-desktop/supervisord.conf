[supervisord]
nodaemon=true
user=edufeed
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24
autorestart=true
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.err

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
autorestart=true
stdout_logfile=/tmp/fluxbox.log
stderr_logfile=/tmp/fluxbox.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -rfbport 5901 -rfbauth /home/edufeed/.vnc/passwd -forever -shared -nopw
autorestart=true
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5901
autorestart=true
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc.err

[program:desktop-app]
command=/usr/bin/java -jar /app/edufeed-desktop.jar
environment=DISPLAY=":1"
autorestart=true
stdout_logfile=/tmp/desktop-app.log
stderr_logfile=/tmp/desktop-app.err
startsecs=10

name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write  # push a GHCR

env:
  REGISTRY: ghcr.io

jobs:
  build-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Maven Verify
        run: mvn -q -B -DskipTests=false verify

  docker:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (lowercase owner)
        id: prep
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV
          echo "IMAGE=${{ env.REGISTRY }}/$OWNER_LC/edufeed-backend" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: edufeed-backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout (compose file)
        uses: actions/checkout@v4

      - name: Compute image & refs
        id: prep
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV
          echo "IMAGE=${{ env.REGISTRY }}/$OWNER_LC/edufeed-backend" >> $GITHUB_ENV

      - name: Copy docker-compose to remote (staging)
        if: ${{ secrets.STAGING_HOST && secrets.STAGING_USER && secrets.STAGING_SSH_KEY }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.STAGING_PATH || '/opt/edufeed-staging' }}

      - name: Deploy via SSH (staging)
        if: ${{ secrets.STAGING_HOST && secrets.STAGING_USER && secrets.STAGING_SSH_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_PATH || '/opt/edufeed-staging' }}
            echo "Logging in to GHCR"
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            echo "Pull latest image"
            docker pull ${{ env.IMAGE }}:latest
            echo "Compose up (requires .env.prod pre-provisioned in server path)"
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://example.com  # opcional: URL de prod
    steps:
      - name: Checkout (compose file)
        uses: actions/checkout@v4

      - name: Compute image & refs
        id: prep
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV
          echo "IMAGE=${{ env.REGISTRY }}/$OWNER_LC/edufeed-backend" >> $GITHUB_ENV

      - name: Copy docker-compose to remote (prod)
        if: ${{ secrets.PROD_HOST && secrets.PROD_USER && secrets.PROD_SSH_KEY }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.PROD_PATH || '/opt/edufeed' }}

      - name: Deploy via SSH (prod)
        if: ${{ secrets.PROD_HOST && secrets.PROD_USER && secrets.PROD_SSH_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH || '/opt/edufeed' }}
            echo "Logging in to GHCR"
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            echo "Pull latest image"
            docker pull ${{ env.IMAGE }}:latest
            echo "Compose up (requires .env.prod pre-provisioned in server path)"
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

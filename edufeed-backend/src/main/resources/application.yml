spring:
  application:
    name: edufeed-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edufeed}
    username: ${DB_USER:edufeed}
    password: ${DB_PASSWORD:edufeed}
    hikari:
      # No fallar inmediatamente si la DB aún no está lista
      initialization-fail-timeout: 0
      connection-timeout: 30000
      # Fijar zona horaria por sesión en PostgreSQL (afecta now(), date_trunc, etc.)
      connectionInitSql: "SET TIME ZONE '${app.timezone}'"
  jpa:
    hibernate:
      ddl-auto: validate
    # properties: (migradas a application.properties para evitar warnings de linter)
  jackson:
    time-zone: ${app.timezone}
  flyway:
    enabled: true
    # Reintentos para esperar a que Postgres esté listo
    connect-retries: 10
    connect-retries-interval: 3s
    # El esquema public ya tiene objetos creados manualmente: inicializa historial
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    name: logs/edufeed-backend.log
  level:
    org:
      springframework:
        security: INFO
      springdoc: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
# Flyway activado con versión compatible para PostgreSQL 16.10

# Zona horaria de la aplicación (puede sobreescribirse con APP_TIMEZONE)
app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  seed:
    operadores:
      enabled: ${SEED_OPERATOR_ENABLED:true}
      username: ${SEED_OPERATOR_USERNAME:admin}
      password: ${SEED_OPERATOR_PASSWORD:Admin123$}
      roles: ${SEED_OPERATOR_ROLES:ROLE_ADMIN}

# JWT Security
security:
  jwt:
    issuer: ${JWT_ISSUER:EduFeed}
    secret: ${JWT_SECRET:ZmFrZS1zZWNyZXQtZGV2LXNob3VsZC1iZS0zMi1vci0xNi1ieXRlcw==} # base64, 32 bytes
    accessTokenValiditySeconds: ${JWT_ACCESS_VALIDITY:3600} # 1 hora
    refreshTokenValiditySeconds: ${JWT_REFRESH_VALIDITY:1209600} # 14 días

# Configuración de biometría (FASE 2.1)
biometric:
  # Clave AES-256 para cifrado de plantillas biométricas (base64, 32 bytes)
  # IMPORTANTE: Generar una clave única en producción y almacenarla en secrets manager
  # Esta es una clave de desarrollo - NO USAR EN PRODUCCIÓN
  encryption:
    key: ${BIOMETRIC_ENCRYPTION_KEY:dGVzdC1rZXktMjU2LWJpdHMtZm9yLWRldmVsb3BtZW50LXB1cnBvc2VzLTEyMzQ1Njc4OTA=}

# (Propiedades personalizadas edufeed.biometric.* movidas a application.properties para evitar advertencias del linter YAML)


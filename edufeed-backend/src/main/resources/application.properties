## Propiedades planas para evitar advertencias del linter YAML
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:UTC}
app.timezone=${APP_TIMEZONE:America/Bogota}

# Proveedor biométrico (FASE 5.1)
edufeed.biometric.provider=${EDUFEED_BIOMETRIC_PROVIDER:mock}
edufeed.biometric.simulateHardware=${EDUFEED_BIOMETRIC_SIMULATE:false}
edufeed.biometric.vendor=${EDUFEED_BIOMETRIC_VENDOR:simulated}
edufeed.biometric.far=${EDUFEED_BIOMETRIC_FAR:0.0001}
edufeed.biometric.frr=${EDUFEED_BIOMETRIC_FRR:0.05}
edufeed.biometric.match-threshold=${EDUFEED_BIOMETRIC_MATCH:0.95}
edufeed.biometric.face.dim=${EDUFEED_BIOMETRIC_FACE_DIM:128}
edufeed.biometric.face.simulate=${EDUFEED_BIOMETRIC_FACE_SIMULATE:true}
edufeed.biometric.face.match-threshold=${EDUFEED_BIOMETRIC_FACE_MATCH:0.6}
edufeed.biometric.face.source=${EDUFEED_BIOMETRIC_FACE_SOURCE:camera:0}
edufeed.biometric.voice.simulate=${EDUFEED_BIOMETRIC_VOICE_SIMULATE:true}
edufeed.biometric.voice.sample-rate=${EDUFEED_BIOMETRIC_VOICE_SR:16000}
edufeed.biometric.voice.duration=${EDUFEED_BIOMETRIC_VOICE_DUR:4}
edufeed.biometric.voice.match-threshold=${EDUFEED_BIOMETRIC_VOICE_MATCH:0.75}

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: edufeed-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    command: [ "--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle", "--web.external-url=/" ]
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    environment:
      - ALERTMANAGER_URL=http://alertmanager:9093

  grafana:
    image: grafana/grafana:11.2.0
    container_name: edufeed-grafana
    depends_on:
      - prometheus
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GRAFANA_SLACK_WEBHOOK: ${GRAFANA_SLACK_WEBHOOK:-}

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: edufeed-alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: edufeed-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: edufeed-logstash
    depends_on:
      - elasticsearch
    volumes:
      - ./observability/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: edufeed-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: edufeed-filebeat
    user: root
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

# Nota: ejecuta este archivo junto con docker-compose.prod.yml para compartir red por defecto:
# docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.observability.yml up -d

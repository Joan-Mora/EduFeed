apiVersion: 1
datasources:
  - name: Prometheus
    uid: PROM_DS
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Elasticsearch-Logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: logs-*
    jsonData:
      timeField: '@timestamp'
      esVersion: 8
      logMessageField: message
      interval: Daily

apiVersion: 1
groups:
  - orgId: 1
    name: http-latency
    folder: Alerts
    interval: 1m
    rules:
      - uid: http_p95_high
        title: HTTP p95 high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PROM_DS
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: 0.5
              refId: B
              type: constant
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                      - B
                  reducer:
                    type: last
                  type: query
              expression: A - B
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Alta latencia p95'
          description: 'p95 de latencia HTTP supera 500ms'
        labels:
          severity: warning

apiVersion: 1
groups:
  - orgId: 1
    name: http-5xx
    folder: Alerts
    interval: 1m
    rules:
      - uid: http_5xx_high
        title: HTTP 5xx high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PROM_DS
            model:
              expr: sum(rate(http_server_requests_seconds_count{status="500"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: 0.1
              refId: B
              type: constant
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                      - B
                  reducer:
                    type: last
                  type: query
              expression: A - B
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Alta tasa de errores 500'
          description: 'HTTP 500s supera 0.1 req/s'
        labels:
          severity: critical

groups:
  - name: edufeed-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status="500"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alto ratio de errores 500"
          description: "La tasa de respuestas 500 es mayor a 0.1 req/s en los últimos 5m"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Alta latencia p95"
          description: "p95 de latencia HTTP supera 500ms en los últimos 5m"
